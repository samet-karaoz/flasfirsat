name: ⚡ Flaş Fırsat Otomasyonu (24/7 Bulut Otopilotu)

on:
  schedule:
    # 1. Kuşak: 12:30 TSİ (Öğle Molası) -> 09:30 UTC
    - cron: '30 9 * * *'
    # 2. Kuşak: 20:00 TSİ (Akşam Prime Time) -> 17:00 UTC
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      slot_name:
        description: 'Kuşak Adı (Örn: Manuel Tetikleme)'
        required: false
        default: 'Manuel Bulut Tetiklemesi'
        type: string

permissions:
  contents: write

jobs:
  hunt-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎬 FFmpeg Kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: 🔑 YouTube ve Instagram Bulut Oturumlarını Yapılandır
        env:
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          IG_SESSION: ${{ secrets.INSTAGRAM_SESSION_JSON }}
        run: |
          mkdir -p data
          python -c "
          import os
          yt = os.getenv('YT_TOKEN')
          if yt:
              with open('data/youtube_token.json', 'w', encoding='utf-8') as f:
                  f.write(yt)
              print('✅ YouTube Token dosyası yüklendi.')
          sec = os.getenv('YT_SECRETS')
          if sec:
              with open('client_secrets.json', 'w', encoding='utf-8') as f:
                  f.write(sec)
              print('✅ YouTube Client Secrets yüklendi.')
          ig = os.getenv('IG_SESSION')
          if ig:
              with open('data/instagram_session.json', 'w', encoding='utf-8') as f:
                  f.write(ig)
              print('✅ Instagram Session dosyası yüklendi.')
          "

      - name: 🚀 4 Platformlu Bulut Otopilotunu Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          TRENDYOL_AFFILIATE_TAG: ${{ secrets.TRENDYOL_AFFILIATE_TAG }}
          HEPSIBURADA_AFFILIATE_TAG: ${{ secrets.HEPSIBURADA_AFFILIATE_TAG }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
        run: |
          SLOT="${{ inputs.slot_name }}"
          [ -z "$SLOT" ] && SLOT="Bulut Otopilotu (12:30 / 20:00)"
          echo "🚀 Bulut Otopilotu Başlatılıyor: $SLOT"
          python autopilot_engine.py --now --slot "$SLOT"

      - name: 🌐 Canlı Web Vitrinini ve Fırsat Geçmişini Otomatik Commit & Push Et
        run: |
          git config --global user.name "flasfirsat-bot[bot]"
          git config --global user.email "bot@flasfirsat.com"
          git add index.html data/deals.json data/autopilot_history.json data/meme_history.json data/replied_comments.json assets/products/ history_deals.json || true
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "⚡ Otomatik Flaş Fırsat & Canlı Vitrin Güncellemesi [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
