name: ⚡ Flaş Fırsat Otomasyonu (İsteğe Bağlı Manuel Stüdyo)

# 🛑 OTOMATİK ZAMANLAYICI KAPALI:
# Video üretimi tamamen kullanıcı onayına ve isteğine bağlıdır.
# Otomatik cron döngüsü kaldırılmıştır. Sadece kullanıcı talimatıyla çalışır.
on:
  workflow_dispatch:
    inputs:
      slot_name:
        description: 'Kuşak Adı (Örn: Manuel Bulut Tetikleme)'
        required: false
        default: 'Manuel Bulut Tetikleme'
        type: string

permissions:
  contents: write

jobs:
  hunt-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎬 FFmpeg Kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: 🔑 YouTube Bulut Oturumunu Yapılandır
        env:
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
        run: |
          mkdir -p data
          python -c "
          import os
          yt = os.getenv('YT_TOKEN')
          if yt:
              with open('data/youtube_token.json', 'w', encoding='utf-8') as f:
                  f.write(yt)
              print('✅ YouTube Token dosyası yüklendi.')
          sec = os.getenv('YT_SECRETS')
          if sec:
              with open('client_secrets.json', 'w', encoding='utf-8') as f:
                  f.write(sec)
              print('✅ YouTube Client Secrets yüklendi.')
          "

      - name: 🚀 7/24 Bulut Stüdyosunu Çalıştır (PC Kapalıyken Tam Otomatik Tekli Video)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          TRENDYOL_AFFILIATE_TAG: ${{ secrets.TRENDYOL_AFFILIATE_TAG }}
          HEPSIBURADA_AFFILIATE_TAG: ${{ secrets.HEPSIBURADA_AFFILIATE_TAG }}
          SITE_URL: "https://flasfirsat.com.tr"
        run: |
          SLOT="${{ inputs.slot_name }}"
          [ -z "$SLOT" ] && SLOT="Bulut Otopilotu (Tekli Video)"
          echo "🚀 Bulut Tekli Fırsat Otopilotu Başlatılıyor: $SLOT"
          python autopilot_engine.py --now --force --slot "$SLOT"

      - name: 🌐 Canlı Web Vitrinini ve Fırsat Geçmişini Otomatik Commit & Push Et
        run: |
          git config --global user.name "flasfirsat-bot[bot]"
          git config --global user.email "bot@flasfirsat.com"
          git add index.html data/deals.json data/autopilot_history.json data/pending_deals.json data/meme_history.json data/replied_comments.json assets/products/ history_deals.json || true
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "⚡ Otomatik Flaş Fırsat & Canlı Vitrin Güncellemesi [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
