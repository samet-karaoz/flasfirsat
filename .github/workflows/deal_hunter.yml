name: ⚡ Flaş Fırsat 7/24 Bulut Otopilotu (YouTube Shorts & TikTok)

on:
  schedule:
    # Türkiye Saati (UTC+3) -> GitHub Actions Cron (UTC)
    # NOT: GitHub Actions sunucularında :00 ve :30 tam saatlerinde global yoğunluk nedeniyle
    # cron atlamalarını %100 önlemek için dakikalar :05 ve :35 olarak ayarlanmıştır.
    # 1. YouTube Shorts (Sabah F/P Teknoloji & Kulaklık/Şarj) -> 11:05 TS (08:05 UTC)
    - cron: '5 8 * * *'
    # 2. TikTok (Öğle Kadın Cilt Bakımı & Kozmetik / Viral Ev) -> 13:05 TS (10:05 UTC)
    - cron: '5 10 * * *'
    # 3. YouTube Shorts (Öğleden Sonra Gaming Gear & Donanım) -> 15:05 TS (12:05 UTC)
    - cron: '5 12 * * *'
    # 4. YouTube Shorts (Prime Time Çok Satan Teknoloji & Bestseller) -> 18:35 TS (15:35 UTC)
    - cron: '35 15 * * *'
    # 5. TikTok (Akşam Prime Time Viral Güzellik, Saç Bakımı & Estetik Yaşam) -> 20:05 TS (17:05 UTC)
    - cron: '5 17 * * *'
    # 6. YouTube Shorts (Gece Yıldız Fırsat / F/P Gadget) -> 21:35 TS (18:35 UTC)
    - cron: '35 18 * * *'

  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Hedef Platform (auto: saate göre, youtube, tiktok, all)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'youtube'
          - 'tiktok'
          - 'all'
      slot_name:
        description: 'Kuşak Adı (Örn: Manuel Bulut Tetikleme)'
        required: false
        default: 'Manuel Bulut Tetikleme'
        type: string

permissions:
  contents: write

concurrency:
  group: git-repo-sync
  cancel-in-progress: false

jobs:
  hunt-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Git Kimliğini Yapılandır
        run: |
          git config --global user.name "flasfirsat-bot[bot]"
          git config --global user.email "bot@flasfirsat.com"

      - name: 🐍 Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎬 FFmpeg Kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: 🔑 YouTube Bulut Oturumunu Yapılandır
        env:
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
        run: |
          mkdir -p data
          python -c "
          import os
          yt = os.getenv('YT_TOKEN')
          if yt:
              with open('data/youtube_token.json', 'w', encoding='utf-8') as f:
                  f.write(yt)
              print('✅ YouTube Token dosyası yüklendi.')
          sec = os.getenv('YT_SECRETS')
          if sec:
              with open('client_secrets.json', 'w', encoding='utf-8') as f:
                  f.write(sec)
              print('✅ YouTube Client Secrets yüklendi.')
          "

      - name: 🚀 7/24 Bulut Otopilotunu Çalıştır (PC Kapalıyken Otomatik Üretim & Yayın)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          TRENDYOL_AFFILIATE_TAG: ${{ secrets.TRENDYOL_AFFILIATE_TAG }}
          HEPSIBURADA_AFFILIATE_TAG: ${{ secrets.HEPSIBURADA_AFFILIATE_TAG }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          SITE_URL: "https://flasfirsat.com.tr"
          AUTOPILOT_REQUIRE_APPROVAL: "false"
        run: |
          PLATFORM="${{ inputs.target_platform || 'auto' }}"
          SLOT="${{ inputs.slot_name || '' }}"

          # Eğer otomatik cron tetiklemişse, saate göre akıllı kuşak ismi ver
          if [ -z "$SLOT" ] || [ "$SLOT" = "Manuel Bulut Tetikleme" ]; then
            UTC_H=$(date -u +%H)
            if [ "$UTC_H" = "08" ]; then
              SLOT="11:00 YouTube Sabah F/P"
            elif [ "$UTC_H" = "10" ]; then
              SLOT="13:00 TikTok Güzellik & Bakım"
            elif [ "$UTC_H" = "12" ]; then
              SLOT="15:00 YouTube Gaming & Donanım"
            elif [ "$UTC_H" = "15" ]; then
              SLOT="18:30 YouTube Prime Time Fırsat"
            elif [ "$UTC_H" = "17" ]; then
              SLOT="20:00 TikTok Akşam Özel Bakım"
            elif [ "$UTC_H" = "18" ]; then
              SLOT="21:30 YouTube Gece F/P"
            else
              SLOT="Bulut Otopilotu (${UTC_H}:00 UTC)"
            fi
          fi

          echo "🚀 Bulut Otopilotu Başlatılıyor..."
          echo "🎯 Platform: $PLATFORM"
          echo "⏰ Kuşak: $SLOT"
          python -u autopilot_engine.py --now --force --auto-publish --platform "$PLATFORM" --slot "$SLOT"

      - name: 🌐 Canlı Web Vitrinini, Video Varlıklarını ve Geçmişi Commit & Push Et
        run: |
          git add index.html data/deals.json data/autopilot_history.json data/pending_deals.json data/meme_history.json data/replied_comments.json assets/products/ assets/videos/ history_deals.json || true
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "⚡ Otomatik Flaş Fırsat & Canlı Vitrin Güncellemesi [skip ci]"
            for i in 1 2 3 4 5; do
              echo "Git senkronizasyonu deneniyor (deneme $i)..."
              git fetch origin main
              git pull --rebase -X theirs origin main || git rebase --abort || true
              git push origin main && echo "✅ Başarıyla push edildi." && break || sleep 5
            done
          fi
